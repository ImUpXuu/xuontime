name = "xuontime"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "16591313e1d38f33215ef81bda994f80"

# 每分钟触发一次检测调度（免费套餐即支持）
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "xuontime"
database_id = "b306764b-9e13-4198-93e6-cc7caf409220"

# 静态资源（公开状态页 / 管理后台）；未命中静态文件的请求（/api/*、/status/*）进入 Worker
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
